id = "musingfox.osc7501"
name = "OSC 7501 agent status"
version = "0.1.0"
min_herdr_version = "0.9.5"
platforms = ["macos"]

[[events]]
on = "pane.agent_status_changed"
command = ["bash", "hook.sh"]

[[events]]
on = "pane.closed"
command = ["bash", "hook.sh"]

[[events]]
on = "pane.exited"
command = ["bash", "hook.sh"]

[[events]]
on = "pane.agent_detected"
command = ["bash", "hook.sh"]

[[events]]
on = "pane.moved"
command = ["bash", "hook.sh"]

[[events]]
on = "tab.closed"
command = ["bash", "hook.sh"]

[[events]]
on = "workspace.closed"
command = ["bash", "hook.sh"]
